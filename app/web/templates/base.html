<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vagas{% endblock %} · copilot-job-gil</title>
  {# Tailwind via CDN: prático para uso local; para produção, gerar o CSS no build #}
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a href="/" class="font-semibold tracking-tight text-slate-900">copilot-job-gil</a>
      <div class="flex gap-4 text-sm text-slate-600">
        <a href="/" class="hover:text-slate-900">Vagas</a>
        <a href="/docs" class="hover:text-slate-900">API</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Buscas e análises levam de segundos a minutos: evita clique duplo e mostra progresso.
    document.querySelectorAll("form[data-busy]").forEach((form) => {
      form.addEventListener("submit", () => {
        const button = form.querySelector("button[type=submit]");
        button.disabled = true;
        button.textContent = form.dataset.busy;
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
