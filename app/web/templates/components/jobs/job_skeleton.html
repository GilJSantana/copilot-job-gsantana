{# Placeholder com a mesma silhueta do JobCard, exibido enquanto a busca roda. #}
{% macro job_skeleton() -%}
  <div class="animate-pulse rounded-sm border border-stroke bg-white p-6 shadow-default dark:border-strokedark dark:bg-boxdark" aria-hidden="true">
    <div class="flex items-start justify-between gap-4">
      <div class="h-5 w-2/3 rounded bg-stroke dark:bg-meta-4"></div>
      <div class="h-6 w-24 rounded-full bg-stroke dark:bg-meta-4"></div>
    </div>
    <div class="mt-3 flex gap-4">
      <div class="h-4 w-28 rounded bg-stroke dark:bg-meta-4"></div>
      <div class="h-4 w-32 rounded bg-stroke dark:bg-meta-4"></div>
      <div class="h-4 w-16 rounded bg-stroke dark:bg-meta-4"></div>
    </div>
    <div class="mt-4 flex gap-2">
      <div class="h-5 w-16 rounded-full bg-stroke dark:bg-meta-4"></div>
      <div class="h-5 w-14 rounded-full bg-stroke dark:bg-meta-4"></div>
      <div class="h-5 w-14 rounded-full bg-stroke dark:bg-meta-4"></div>
    </div>
    <div class="mt-5 flex justify-end gap-2 border-t border-stroke pt-4 dark:border-strokedark">
      <div class="h-9 w-28 rounded-md bg-stroke dark:bg-meta-4"></div>
      <div class="h-9 w-28 rounded-md bg-stroke dark:bg-meta-4"></div>
      <div class="h-9 w-44 rounded-md bg-stroke dark:bg-meta-4"></div>
    </div>
  </div>
{%- endmacro %}

{% macro job_skeletons(count=3) -%}
  {% for _ in range(count) %}{{ job_skeleton() }}{% endfor %}
{%- endmacro %}
