{# Card de seção do TailAdmin; uso: {% call card("id", "Título", "Descrição") %}…{% endcall %} #}
{% macro card(id, title, description=none) -%}
  <section id="{{ id }}" aria-labelledby="{{ id }}-title"
           class="mb-6 scroll-mt-24 rounded-sm border border-stroke bg-white shadow-default dark:border-strokedark dark:bg-boxdark">
    <div class="border-b border-stroke px-6 py-4 dark:border-strokedark">
      <h2 id="{{ id }}-title" class="text-lg font-semibold text-black dark:text-white">{{ title }}</h2>
      {% if description %}<p class="mt-0.5 text-sm text-body dark:text-bodydark">{{ description }}</p>{% endif %}
    </div>
    <div class="p-6">
      {{ caller() }}
    </div>
  </section>
{%- endmacro %}
